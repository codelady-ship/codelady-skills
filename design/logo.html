<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sacramento&family=Archivo+Black&display=block" rel="stylesheet">
<style>
  html,body{margin:0;background:transparent}
  .tile{width:1024px;height:1024px;position:relative;overflow:hidden;background:#c8961e;border-radius:0}
  .words{position:absolute;inset:-200px;transform:rotate(-14deg);font:72px/1.18 'Archivo Black',sans-serif;color:#b8861a;letter-spacing:-1px;white-space:nowrap;user-select:none}
  .plain .words{display:none}
  svg{position:absolute;inset:0}
</style></head>
<body>
<div class="tile" id="tile">
  <div class="words" id="words"></div>
  <svg viewBox="0 0 1024 1024" width="1024" height="1024">
    <defs>
      <radialGradient id="glass" cx="42%" cy="34%" r="70%">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset=".55" stop-color="#eef0f2"/>
        <stop offset="1" stop-color="#b9bec4"/>
      </radialGradient>
      <linearGradient id="metal" x1="0" x2="1">
        <stop offset="0" stop-color="#2b2b2b"/><stop offset=".35" stop-color="#9a9a9a"/>
        <stop offset=".55" stop-color="#e6e6e6"/><stop offset="1" stop-color="#3a3a3a"/>
      </linearGradient>
      <linearGradient id="neck" x1="0" x2="1">
        <stop offset="0" stop-color="#c9ced3"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#b5bac0"/>
      </linearGradient>
      <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#5a3f00" flood-opacity=".35"/></filter>
    </defs>
    <g filter="url(#soft)">
      <!-- glass -->
      <path d="M512 92 C 330 92 214 222 214 372 C 214 470 262 536 312 600 C 350 650 384 690 396 760 L 628 760 C 640 690 674 650 712 600 C 762 536 810 470 810 372 C 810 222 694 92 512 92 Z"
            fill="url(#glass)" stroke="#8e949b" stroke-width="5"/>
      <!-- highlights -->
      <path d="M300 300 C 318 228 372 172 446 150" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round" opacity=".95"/>
      <path d="M282 372 C 282 356 284 342 288 330" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" opacity=".9"/>
      <!-- support wires -->
      <path d="M470 760 L 470 640 C 470 560 452 470 440 420" fill="none" stroke="#5d6166" stroke-width="4"/>
      <path d="M554 760 L 554 640 C 554 560 572 470 584 420" fill="none" stroke="#5d6166" stroke-width="4"/>
      <!-- stem -->
      <path d="M478 640 L 478 760 L 546 760 L 546 640 C 546 620 478 620 478 640 Z" fill="url(#neck)" stroke="#9aa0a6" stroke-width="3" opacity=".85"/>
      <!-- base -->
      <rect x="392" y="756" width="240" height="30" rx="10" fill="url(#metal)"/>
      <rect x="398" y="786" width="228" height="30" rx="12" fill="url(#metal)"/>
      <rect x="404" y="816" width="216" height="30" rx="12" fill="url(#metal)"/>
      <rect x="410" y="846" width="204" height="30" rx="12" fill="url(#metal)"/>
      <path d="M432 876 L 592 876 C 590 906 560 930 512 930 C 464 930 434 906 432 876 Z" fill="url(#metal)"/>
      <circle cx="512" cy="936" r="16" fill="#2b2b2b"/>
    </g>
    <!-- filament word -->
    <text x="512" y="440" text-anchor="middle" font-family="Sacramento" font-size="250"
          fill="#2a2a2a" stroke="#2a2a2a" stroke-width="5" paint-order="stroke">Skill</text>
  </svg>
</div>
<script>
  const list = ['scholarship','visa','voice','career','research','safety','strategy','travel','interview','creativity','leadership','problem solving','communication'];
  let rows = '';
  for (let r = 0; r < 18; r++) {
    let line = '';
    for (let i = 0; i < 10; i++) line += list[(r * 3 + i) % list.length] + ' ';
    rows += `<div style="margin-left:${-(r % 3) * 120}px">${line}</div>`;
  }
  document.getElementById('words').innerHTML = rows;
  if (location.hash === '#plain') document.getElementById('tile').classList.add('plain');
</script>
</body></html>
